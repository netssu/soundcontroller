<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Mesa Sonora RPG</title>
  <meta name="description" content="Player de campanhas de RPG com playlists, YouTube, MP3, fade e tempos salvos no navegador.">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f5f2;
      --ink: #1f2328;
      --muted: #68717b;
      --panel: #ffffff;
      --panel-2: #ecefed;
      --line: #d7ddd9;
      --rail: #202427;
      --rail-soft: #2d3236;
      --rail-ink: #f3f5f2;
      --teal: #237c74;
      --teal-2: #d8efec;
      --red: #8f3546;
      --gold: #bb8732;
      --focus: #4f9d90;
      --shadow: 0 18px 45px rgba(20, 24, 28, 0.12);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      letter-spacing: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        linear-gradient(120deg, rgba(35, 124, 116, 0.08), transparent 30%),
        linear-gradient(240deg, rgba(143, 53, 70, 0.08), transparent 34%),
        var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      min-height: 42px;
      padding: 10px 12px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus,
    button:focus-visible {
      outline: 3px solid rgba(79, 157, 144, 0.35);
      outline-offset: 2px;
    }

    textarea {
      min-height: 168px;
      resize: vertical;
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
      line-height: 1.45;
    }

    .app {
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr) 360px;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--rail);
      color: var(--rail-ink);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 44px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: var(--radius);
      background: linear-gradient(145deg, var(--teal), var(--red));
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
      font-weight: 800;
    }

    .brand span {
      display: block;
      margin-top: 2px;
      color: #c5ccc7;
      font-size: 12px;
      font-weight: 600;
    }

    .playlist-create {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 44px;
      gap: 8px;
    }

    .playlist-create input {
      border-color: rgba(255, 255, 255, 0.16);
      background: var(--rail-soft);
      color: var(--rail-ink);
    }

    .playlist-create input::placeholder {
      color: #aeb8b1;
    }

    .icon-button,
    .text-button {
      min-height: 42px;
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--ink);
      background: var(--panel-2);
      padding: 0 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .icon-button {
      width: 42px;
      padding: 0;
      flex: 0 0 auto;
    }

    .primary {
      background: var(--teal);
      color: #fff;
    }

    .danger {
      background: rgba(143, 53, 70, 0.12);
      color: var(--red);
    }

    .ghost {
      background: transparent;
      color: inherit;
      border: 1px solid currentColor;
    }

    .button-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .playlist-list {
      display: grid;
      gap: 8px;
      overflow: auto;
      padding-right: 2px;
    }

    .playlist-empty {
      min-height: 58px;
      border-radius: var(--radius);
      border: 1px dashed rgba(255, 255, 255, 0.22);
      display: grid;
      place-items: center;
      text-align: center;
      color: #c5ccc7;
      font-weight: 750;
      padding: 12px;
    }

    .playlist-item {
      min-height: 58px;
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.045);
      color: var(--rail-ink);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 10px;
      text-align: left;
    }

    .playlist-item.is-active {
      background: var(--teal-2);
      color: #183b38;
      border-color: transparent;
    }

    .playlist-name,
    .track-title,
    .sfx-title,
    .current-title {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .playlist-name,
    .track-title,
    .sfx-title {
      cursor: text;
    }

    .playlist-name[data-editing="1"],
    .track-title[data-editing="1"],
    .sfx-title[data-editing="1"] {
      cursor: text;
    }

    .playlist-name {
      font-weight: 800;
    }

    .playlist-count {
      color: currentColor;
      opacity: 0.72;
      font-size: 12px;
      margin-top: 2px;
    }

    .mini-actions {
      display: flex;
      gap: 4px;
    }

    .mini-actions .icon-button {
      width: 34px;
      min-height: 34px;
      background: rgba(255, 255, 255, 0.12);
      color: currentColor;
    }

    .main {
      min-width: 0;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: end;
    }

    .page-title {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .page-title h2 {
      margin: 0;
      font-size: 28px;
      line-height: 1.12;
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat {
      min-height: 38px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      color: var(--muted);
      font-weight: 750;
      white-space: nowrap;
    }

    .add-track {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      display: grid;
      grid-template-columns: minmax(130px, 1fr) minmax(220px, 1.6fr) minmax(150px, 0.85fr) auto;
      gap: 10px;
      align-items: center;
    }

    .track-list {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .track-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      min-height: 112px;
    }

    .track-card.is-playing {
      border-color: rgba(35, 124, 116, 0.62);
      box-shadow: 0 0 0 3px rgba(35, 124, 116, 0.11);
    }

    .play-button {
      width: 46px;
      min-height: 46px;
      border-radius: 50%;
      background: var(--teal);
      color: #fff;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .track-meta {
      min-width: 0;
    }

    .track-title {
      font-weight: 850;
      font-size: 16px;
      margin: 0 0 4px;
    }

    .track-url {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }

    .time-box {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    .track-controls {
      grid-column: 2 / -1;
      display: grid;
      grid-template-columns: minmax(190px, 1.35fr) minmax(128px, 0.72fr) auto;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    .control-cell {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .control-cell label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 850;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .range-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .range-value {
      color: var(--muted);
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      min-width: 48px;
      text-align: right;
      white-space: nowrap;
    }

    .loop-pill {
      min-height: 36px;
      border-radius: var(--radius);
      background: var(--panel-2);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .loop-pill input {
      width: 16px;
      min-height: 16px;
      padding: 0;
      accent-color: var(--teal);
    }

    .time-text {
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .progress {
      height: 8px;
      border-radius: 999px;
      background: #dfe4e1;
      overflow: hidden;
    }

    .progress > span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--teal), var(--gold));
      border-radius: inherit;
    }

    .empty-state {
      border: 1px dashed #b8c2bd;
      border-radius: var(--radius);
      min-height: 172px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.55);
      padding: 20px;
      font-weight: 700;
    }

    .right-panel {
      min-width: 0;
      border-left: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.55);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: auto;
    }

    .tool-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .tool-panel h3 {
      margin: 0;
      font-size: 15px;
      line-height: 1.2;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .current-box {
      display: grid;
      gap: 10px;
    }

    .current-title {
      font-size: 19px;
      font-weight: 900;
      margin: 0;
    }

    .current-subtitle {
      color: var(--muted);
      margin: 0;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .youtube-status {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f8faf9;
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .youtube-status-main {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      min-width: 0;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-top: 5px;
      background: var(--muted);
      flex: 0 0 auto;
    }

    .youtube-status[data-state="ready"] .status-dot {
      background: var(--teal);
    }

    .youtube-status[data-state="loading"] .status-dot,
    .youtube-status[data-state="warning"] .status-dot {
      background: var(--gold);
    }

    .youtube-status[data-state="error"] .status-dot {
      background: var(--red);
    }

    .youtube-status-title {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
    }

    .youtube-status-text {
      display: block;
      color: var(--ink);
      font-size: 12px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .youtube-status-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .youtube-status-actions .text-button,
    .youtube-status-actions .icon-button {
      min-height: 34px;
      font-size: 12px;
    }

    a.text-button {
      text-decoration: none;
    }

    .meter {
      display: grid;
      gap: 8px;
    }

    .meter label,
    .field-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
    }

    input[type="range"] {
      padding: 0;
      min-height: 28px;
      accent-color: var(--teal);
      border: 0;
    }

    .youtube-shell {
      width: 220px;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      background: #151718;
      border-radius: var(--radius);
      overflow: hidden;
      display: none;
      justify-self: center;
    }

    .youtube-shell.is-visible {
      display: block;
    }

    #youtube-player,
    #youtube-player iframe {
      width: 100%;
      height: 100%;
      display: block;
    }

    .audio-shell {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background:
        repeating-linear-gradient(90deg, rgba(35, 124, 116, 0.18), rgba(35, 124, 116, 0.18) 4px, transparent 4px, transparent 12px),
        linear-gradient(135deg, #ffffff, #edf4f2);
      min-height: 86px;
      display: grid;
      place-items: center;
      color: var(--teal);
    }

    .audio-shell.is-youtube {
      background:
        repeating-linear-gradient(90deg, rgba(187, 135, 50, 0.16), rgba(187, 135, 50, 0.16) 4px, transparent 4px, transparent 12px),
        linear-gradient(135deg, #ffffff, #f7f1e7);
      color: var(--gold);
    }

    .audio-shell.is-hidden {
      display: none;
    }

    .player-alert {
      border: 1px solid rgba(187, 135, 50, 0.42);
      border-radius: var(--radius);
      background: #fff7e8;
      color: #694916;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .mini-player-pool {
      width: 1px;
      height: 1px;
      overflow: hidden;
      position: fixed;
      left: -10px;
      top: -10px;
      opacity: 0;
      pointer-events: none;
    }

    .export-list {
      display: grid;
      gap: 8px;
      max-height: 152px;
      overflow: auto;
      padding-right: 2px;
    }

    .check-row {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      padding: 7px 9px;
      background: #fff;
      color: var(--ink);
      font-weight: 750;
    }

    .check-row input {
      width: 16px;
      min-height: 16px;
      accent-color: var(--teal);
    }

    .check-row span {
      overflow-wrap: anywhere;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      min-height: 42px;
      max-width: min(520px, calc(100vw - 24px));
      padding: 10px 14px;
      border-radius: var(--radius);
      background: #1f2328;
      color: #fff;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
      font-weight: 750;
      z-index: 20;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    .sfx-dock {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 15;
      width: min(420px, calc(100vw - 36px));
      max-height: min(78vh, 720px);
      border: 1px solid rgba(31, 35, 40, 0.14);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      overflow: hidden;
      backdrop-filter: blur(14px);
    }

    .sfx-dock.is-dragging {
      cursor: grabbing;
      transition: none;
    }

    .sfx-header {
      min-height: 46px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: #fbfcfb;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .sfx-header h3 {
      margin: 0;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .sfx-header .icon-button {
      cursor: pointer;
    }

    .sfx-form {
      display: grid;
      grid-template-columns: minmax(84px, 0.9fr) minmax(112px, 1.2fr) 42px;
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .sfx-form input {
      min-height: 38px;
      padding: 8px 10px;
    }

    .sfx-list {
      display: grid;
      gap: 8px;
      padding: 10px;
      overflow: auto;
      min-height: 90px;
      max-height: 460px;
    }

    .sfx-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 9px;
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
    }

    .sfx-card.is-playing {
      border-color: rgba(187, 135, 50, 0.75);
      box-shadow: 0 0 0 3px rgba(187, 135, 50, 0.13);
    }

    .sfx-play {
      width: 38px;
      min-height: 38px;
      border-radius: 50%;
      background: var(--gold);
      color: #fff;
      display: grid;
      place-items: center;
    }

    .sfx-title {
      margin: 0 0 2px;
      font-weight: 850;
      font-size: 14px;
    }

    .sfx-url {
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sfx-controls {
      grid-column: 2 / -1;
      display: grid;
      grid-template-columns: minmax(140px, 1fr) minmax(90px, 0.7fr) auto;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .sfx-card .loop-pill {
      min-height: 32px;
      padding: 0 8px;
      font-size: 11px;
    }

    .hidden {
      display: none !important;
    }

    svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.25;
      flex: 0 0 auto;
    }

    @media (max-width: 1340px) {
      .app {
        grid-template-columns: 256px minmax(0, 1fr);
      }

      .right-panel {
        grid-column: 1 / -1;
        border-left: 0;
        border-top: 1px solid var(--line);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: start;
      }
    }

    @media (max-width: 820px) {
      .app {
        display: block;
      }

      .sidebar,
      .main,
      .right-panel {
        padding: 16px;
      }

      .playlist-list {
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        max-height: none;
      }

      .topbar,
      .add-track,
      .track-card,
      .track-controls,
      .sfx-form,
      .sfx-card,
      .sfx-controls,
      .right-panel {
        grid-template-columns: 1fr;
      }

      .stats {
        justify-content: flex-start;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .track-card {
        gap: 10px;
      }

      .track-card .mini-actions {
        justify-content: flex-start;
      }

      .time-box {
        max-width: 260px;
      }

      .track-controls,
      .sfx-controls {
        grid-column: 1 / -1;
      }

      .sfx-dock {
        right: 10px;
        bottom: 10px;
        width: calc(100vw - 20px);
        max-height: 64vh;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><i data-lucide="music-4"></i></div>
        <div>
          <h1>Mesa Sonora</h1>
          <span>campanhas de RPG</span>
        </div>
      </div>

      <form class="playlist-create" id="playlist-form">
