  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    const STORAGE_KEY = "mesa-sonora-rpg:v1";
    const SAVE_INTERVAL_MS = 1200;
    const DEFAULT_MASTER_VOLUME = 82;
    const DEFAULT_FADE_MS = 1800;

    const dom = {
      playlistForm: document.querySelector("#playlist-form"),
      playlistName: document.querySelector("#playlist-name"),
      playlistList: document.querySelector("#playlist-list"),
      activePlaylistTitle: document.querySelector("#active-playlist-title"),
      statPlaylists: document.querySelector("#stat-playlists"),
      statTracks: document.querySelector("#stat-tracks"),
      clearTracksButton: document.querySelector("#clear-tracks-button"),
      resetSiteButton: document.querySelector("#reset-site-button"),
      trackForm: document.querySelector("#track-form"),
      trackTitle: document.querySelector("#track-title"),
      trackUrl: document.querySelector("#track-url"),
      trackPlaylist: document.querySelector("#track-playlist"),
      trackSubmit: document.querySelector("#track-submit"),
      trackList: document.querySelector("#track-list"),
      youtubeStatus: document.querySelector("#youtube-status"),
      youtubeStatusText: document.querySelector("#youtube-status-text"),
      youtubeLoginLink: document.querySelector("#youtube-login-link"),
      youtubeStatusRefresh: document.querySelector("#youtube-status-refresh"),
      youtubeShell: document.querySelector("#youtube-shell"),
      youtubeNotice: document.querySelector("#youtube-notice"),
      audioShell: document.querySelector("#audio-shell"),
      currentTitle: document.querySelector("#current-title"),
      currentSubtitle: document.querySelector("#current-subtitle"),
      currentProgress: document.querySelector("#current-progress"),
      currentTime: document.querySelector("#current-time"),
      pauseButton: document.querySelector("#pause-button"),
      stopButton: document.querySelector("#stop-button"),
      masterVolume: document.querySelector("#master-volume"),
      fadeDuration: document.querySelector("#fade-duration"),
      volumeValue: document.querySelector("#volume-value"),
      fadeValue: document.querySelector("#fade-value"),
      exportList: document.querySelector("#export-list"),
      exportButton: document.querySelector("#export-button"),
      copyButton: document.querySelector("#copy-button"),
      downloadButton: document.querySelector("#download-button"),
      exportOutput: document.querySelector("#export-output"),
      importInput: document.querySelector("#import-input"),
      importButton: document.querySelector("#import-button"),
      sfxForm: document.querySelector("#sfx-form"),
      sfxDock: document.querySelector("#sfx-dock"),
      sfxDragHandle: document.querySelector("#sfx-drag-handle"),
      sfxTitle: document.querySelector("#sfx-title"),
      sfxUrl: document.querySelector("#sfx-url"),
      sfxList: document.querySelector("#sfx-list"),
      sfxCount: document.querySelector("#sfx-count"),
      sfxStopAll: document.querySelector("#sfx-stop-all"),
      sfxYoutubePool: document.querySelector("#sfx-youtube-pool"),
      toast: document.querySelector("#toast")
    };

    const audio = new Audio();
    audio.preload = "auto";
    audio.playsInline = true;
    audio.setAttribute("playsinline", "");

    // Mantém o áudio rodando em segundo plano evitando que o navegador descarte/pause.
    audio.addEventListener("pause", () => {
      if (current.type === "audio" && current.playing && !audio.ended) {
        audio.play().catch(() => {});
      }
    });
    const isFilePage = window.location.protocol === "file:";
    const YOUTUBE_EMBED_HOST = "https://www.youtube.com";
    const youtubeLocalMessage = "YouTube não toca quando o HTML é aberto direto como arquivo. Abra por GitHub Pages ou por http://localhost; links diretos .mp3 continuam funcionando.";

    let state = loadState();
    let current = { trackId: null, type: null, playing: false };
    let ytPlayer = null;
    let ytReady = false;
    let ytWaiters = [];
    let ytApiRequested = false;
    let ytApiFailed = false;
    let youtubeLoginOpened = false;
    let switchToken = 0;
    let saveTimer = null;
    let toastTimer = null;
    let sfxDockDrag = null;
    const sfxPlayers = new Map();

    window.onYouTubeIframeAPIReady = () => createYoutubePlayer();

    function createYoutubePlayer() {
      if (ytPlayer || !window.YT?.Player) return;
      ytPlayer = new YT.Player("youtube-player", {
        host: YOUTUBE_EMBED_HOST,
        width: "100%",
        height: "100%",
        playerVars: getYoutubePlayerVars({
          controls: 0,
          disablekb: 1
        }),
        events: {
          onReady: (event) => {
            ytReady = true;
            patchYoutubeIframe(event.target);
            renderYoutubeSessionStatus();
            settleYoutubeWaiters();
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.ENDED && current.type === "youtube") {
              const track = findTrack(current.trackId);
              if (track?.loop) {
                track.time = 0;
                ytPlayer.seekTo(0, true);
                ytPlayer.playVideo();
              } else {
                handleTrackEnded();
              }
            }
          },
          onError: (event) => handleYoutubeError(event.data, findTrack(current.trackId)?.title || "YouTube")
        }
      });
    }

    dom.playlistForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = dom.playlistName.value.trim();
      if (!name) return;
      const playlist = { id: uid(), name, tracks: [] };
      state.playlists.push(playlist);
      state.selectedPlaylistId = playlist.id;
      dom.playlistName.value = "";
      saveState();
      render();
      toast("Playlist criada.");
    });

    dom.trackForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const url = dom.trackUrl.value.trim();
      if (!url) return;
      const playlist = getPlaylist(dom.trackPlaylist.value) || getSelectedPlaylist();
      if (!playlist) {
        toast("Crie uma playlist antes de adicionar música.");
        return;
      }
      const media = getMediaInfo(url);
      if (media.type === "youtube" && !media.videoId) {
        toast("Link do YouTube inválido.");
        return;
      }
      const title = dom.trackTitle.value.trim() || guessTitle(url);
      playlist.tracks.push({
        id: uid(),
        title,
        url,
        type: media.type,
        videoId: media.videoId || "",
        time: 0,
        duration: 0,
        volume: 100,
        loop: false,
        createdAt: Date.now()
      });
      state.selectedPlaylistId = playlist.id;
      dom.trackTitle.value = "";
      dom.trackUrl.value = "";
      saveState();
      render();
      toast("Música adicionada.");
    });

    dom.clearTracksButton.addEventListener("click", clearSelectedPlaylistTracks);
    dom.resetSiteButton.addEventListener("click", resetSite);

    dom.youtubeStatusRefresh.addEventListener("click", () => {
      renderYoutubeSessionStatus();
      toast("Status do YouTube atualizado.");
    });

    dom.youtubeLoginLink.addEventListener("click", () => {
      youtubeLoginOpened = true;
      renderYoutubeSessionStatus("login-opened");
    });

    window.addEventListener("focus", () => {
      if (!youtubeLoginOpened) return;
      youtubeLoginOpened = false;
      renderYoutubeSessionStatus("returned");
    });

    dom.playlistList.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const action = button.dataset.action;
      const id = button.dataset.id;
      const playlist = getPlaylist(id);
      if (!playlist) return;

      if (action === "select-playlist") {
        state.selectedPlaylistId = id;
        saveState();
        render();
      }

      if (action === "rename-playlist") {
        const item = button.closest(".playlist-item");
        const target = item?.querySelector(".playlist-name");
        if (target) {
          editInline(target, playlist.name, 72, (next) => {
            playlist.name = next;
            saveState();
            render();
          });
        }
      }

      if (action === "delete-playlist") {
        if (state.playlists.length === 1) {
          toast("Mantenha pelo menos uma playlist.");
          return;
        }
        if (!confirm(`Excluir "${playlist.name}"?`)) return;
        const ids = new Set(playlist.tracks.map((track) => track.id));
        if (current.trackId && ids.has(current.trackId)) {
          stopActive();
        }
        state.playlists = state.playlists.filter((item) => item.id !== id);
        if (state.selectedPlaylistId === id) {
          state.selectedPlaylistId = state.playlists[0].id;
        }
        saveState();
        render();
      }
    });

    dom.trackList.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const action = button.dataset.action;
      const track = findTrack(button.dataset.id);
      if (!track) return;

      if (action === "play-track") {
        await playTrack(track.id);
      }

      if (action === "rename-track") {
        const card = button.closest(".track-card");
        const target = card?.querySelector(".track-title");
        if (target) {
          editInline(target, track.title, 96, (next) => {
            track.title = next;
            saveState();
            render();
          });
        }
      }

      if (action === "reset-time") {
        track.time = 0;
        if (current.trackId === track.id) {
          seekActive(0);
        }
        saveState();
        render();
      }

      if (action === "delete-track") {
        if (!confirm(`Remover "${track.title}"?`)) return;
        if (current.trackId === track.id) {
          stopActive();
        }
        for (const playlist of state.playlists) {
          playlist.tracks = playlist.tracks.filter((item) => item.id !== track.id);
        }
        saveState();
        render();
      }
    });

    dom.trackList.addEventListener("input", (event) => {
      const input = event.target;
      const track = findTrack(input.dataset.id);
      if (!track) return;

      if (input.dataset.action === "seek-track") {
        const seconds = Number(input.value);
        track.time = seconds;
        if (current.trackId === track.id) {
          seekActive(seconds);
        }
        syncTimeViews();
        queueSave();
      }

      if (input.dataset.action === "volume-track") {
        track.volume = Number(input.value);
        if (current.trackId === track.id && current.playing) {
          setActiveVolume(getTrackOutputVolume(track));
        }
        syncVolumeViews(track);
        queueSave();
      }
    });

    dom.trackList.addEventListener("change", (event) => {
      const input = event.target;
      if (input.dataset.action !== "loop-track") return;
      const track = findTrack(input.dataset.id);
      if (!track) return;
      track.loop = input.checked;
      if (current.trackId === track.id && current.type === "audio") {
        audio.loop = track.loop;
      }
      queueSave();
    });

    dom.pauseButton.addEventListener("click", () => togglePauseActive());
    dom.stopButton.addEventListener("click", () => stopActive());

    dom.sfxForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const url = dom.sfxUrl.value.trim();
      if (!url) return;
      const media = getMediaInfo(url);
      if (media.type === "youtube" && !media.videoId) {
        toast("Link do YouTube inválido.");
        return;
      }
      state.sfx.push({
        id: uid(),
        title: (dom.sfxTitle.value.trim() || guessTitle(url)).slice(0, 72),
        url,
        type: media.type,
        videoId: media.videoId || "",
        time: 0,
        duration: 0,
        volume: 100,
        loop: false,
        createdAt: Date.now()
      });
      dom.sfxTitle.value = "";
      dom.sfxUrl.value = "";
      saveState();
      renderSfx();
      toast("Efeito adicionado.");
    });

    dom.sfxList.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const effect = findSfx(button.dataset.id);
      if (!effect) return;

      if (button.dataset.action === "play-sfx") {
        await toggleSfx(effect.id);
      }

      if (button.dataset.action === "reset-sfx") {
        effect.time = 0;
        seekSfx(effect.id, 0);
        saveState();
        syncSfxViews();
      }

      if (button.dataset.action === "rename-sfx") {
        const card = button.closest(".sfx-card");
        const target = card?.querySelector(".sfx-title");
        if (target) {
          editInline(target, effect.title, 72, (next) => {
            effect.title = next;
            saveState();
            renderSfx();
          });
        }
      }

      if (button.dataset.action === "delete-sfx") {
        if (!confirm(`Remover "${effect.title}"?`)) return;
        stopSfx(effect.id, false);
        state.sfx = state.sfx.filter((item) => item.id !== effect.id);
        saveState();
        renderSfx();
      }
    });

    dom.sfxList.addEventListener("input", (event) => {
      const input = event.target;
      const effect = findSfx(input.dataset.id);
      if (!effect) return;

      if (input.dataset.action === "seek-sfx") {
        effect.time = Number(input.value);
        seekSfx(effect.id, effect.time);
        syncSfxViews();
        queueSave();
      }

      if (input.dataset.action === "volume-sfx") {
        effect.volume = Number(input.value);
        setSfxVolume(effect.id);
        syncVolumeViews(effect);
        queueSave();
      }
    });

    dom.sfxList.addEventListener("change", (event) => {
      const input = event.target;
      if (input.dataset.action !== "loop-sfx") return;
      const effect = findSfx(input.dataset.id);
      if (!effect) return;
      effect.loop = input.checked;
      const engine = sfxPlayers.get(effect.id);
      if (engine?.audio) engine.audio.loop = effect.loop;
      queueSave();
    });

    dom.sfxStopAll.addEventListener("click", () => {
      stopAllSfx(false);
      toast("Efeitos parados.");
    });

    dom.sfxDragHandle.addEventListener("pointerdown", startSfxDockDrag);
    window.addEventListener("pointermove", moveSfxDock);
    window.addEventListener("pointerup", endSfxDockDrag);
    window.addEventListener("pointercancel", endSfxDockDrag);
    window.addEventListener("resize", () => applySfxDockPosition(true));

    dom.masterVolume.addEventListener("input", () => {
      state.masterVolume = Number(dom.masterVolume.value);
      dom.volumeValue.textContent = `${state.masterVolume}%`;
      const track = findTrack(current.trackId);
      if (current.playing && track) setActiveVolume(getTrackOutputVolume(track));
      queueSave();
    });

    dom.fadeDuration.addEventListener("input", () => {
      state.fadeMs = Number(dom.fadeDuration.value);
      dom.fadeValue.textContent = `${(state.fadeMs / 1000).toFixed(1)}s`;
      queueSave();
    });

    dom.exportButton.addEventListener("click", () => {
      dom.exportOutput.value = buildExportText();
      toast("Texto gerado.");
    });

    dom.copyButton.addEventListener("click", async () => {
      if (!dom.exportOutput.value.trim()) {
        dom.exportOutput.value = buildExportText();
      }
      try {
        await navigator.clipboard.writeText(dom.exportOutput.value);
        toast("Texto copiado.");
      } catch {
        dom.exportOutput.select();
        document.execCommand("copy");
        toast("Texto selecionado para copiar.");
      }
    });

    dom.downloadButton.addEventListener("click", () => {
      if (!dom.exportOutput.value.trim()) {
        dom.exportOutput.value = buildExportText();
      }
      const blob = new Blob([dom.exportOutput.value], { type: "text/plain;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "mesa-sonora-playlists.txt";
      link.click();
      URL.revokeObjectURL(link.href);
    });

    dom.importButton.addEventListener("click", () => {
      const result = importText(dom.importInput.value);
      if (!result.count) {
        toast("Nenhuma música encontrada no texto.");
        return;
      }
      dom.importInput.value = "";
      saveState();
      render();
      toast(`${result.count} música${result.count === 1 ? "" : "s"} importada${result.count === 1 ? "" : "s"}.`);
    });

    audio.addEventListener("ended", handleTrackEnded);
    audio.addEventListener("loadedmetadata", () => {
      if (current.type !== "audio") return;
      const track = findTrack(current.trackId);
      if (track && Number.isFinite(audio.duration)) {
        track.duration = audio.duration;
        queueSave();
        syncTimeViews();
      }
    });

    const backgroundTicker = createBackgroundTicker(SAVE_INTERVAL_MS, () => {
      if (current.playing) {
        saveCurrentTime(false);
        syncTimeViews();
      }
      if (sfxPlayers.size) {
        saveSfxTimes(false);
        syncSfxViews();
      }
    });
    backgroundTicker.start();

    function createBackgroundTicker(intervalMs, onTick) {
      let worker = null;
      let fallbackId = null;
      try {
        const workerSource = `
          let timer = null;
          self.onmessage = (event) => {
            const data = event.data || {};
            if (data.type === "start") {
              if (timer) clearInterval(timer);
              timer = setInterval(() => self.postMessage("tick"), data.interval || 1000);
            } else if (data.type === "stop") {
              if (timer) { clearInterval(timer); timer = null; }
            }
          };
        `;
        const blob = new Blob([workerSource], { type: "application/javascript" });
        const url = URL.createObjectURL(blob);
        worker = new Worker(url);
        worker.onmessage = () => onTick();
      } catch {
        worker = null;
      }
      return {
        start() {
          if (worker) {
            worker.postMessage({ type: "start", interval: intervalMs });
          } else {
            if (fallbackId) clearInterval(fallbackId);
            fallbackId = setInterval(onTick, intervalMs);
          }
        },
        stop() {
          if (worker) worker.postMessage({ type: "stop" });
          if (fallbackId) { clearInterval(fallbackId); fallbackId = null; }
        }
      };
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        if (current.playing) {
          saveCurrentTime(false);
          syncTimeViews();
        }
        if (sfxPlayers.size) {
          saveSfxTimes(false);
          syncSfxViews();
        }
      }
    });

    // Mantém a sessão de áudio ativa em segundo plano (evita throttling/eco mode).
    let keepAliveCtx = null;
    function ensureAudioKeepAlive() {
      if (keepAliveCtx) {
        if (keepAliveCtx.state === "suspended") keepAliveCtx.resume().catch(() => {});
        return;
      }
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        keepAliveCtx = new Ctx();
        const oscillator = keepAliveCtx.createOscillator();
        const gain = keepAliveCtx.createGain();
        gain.gain.value = 0.0001;
        oscillator.frequency.value = 1;
        oscillator.connect(gain).connect(keepAliveCtx.destination);
        oscillator.start();
      } catch {}
    }
    document.addEventListener("click", ensureAudioKeepAlive, { once: true });
    document.addEventListener("keydown", ensureAudioKeepAlive, { once: true });

    render();
    renderYoutubeNotice();
    renderYoutubeSessionStatus();
    applySfxDockPosition(true);

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return createStarterState();
        const parsed = JSON.parse(saved);
        if (parsed && Array.isArray(parsed.playlists)) {
          return normalizeState(parsed);
        }
      } catch {}
      return createStarterState();
    }

    function createStarterState() {
      const id = uid();
      return {
        ...createEmptyState(),
        playlists: [{ id, name: "Cena da taverna inicio", tracks: [] }],
        selectedPlaylistId: id
      };
    }

    function createEmptyState() {
      return {
        playlists: [],
        sfx: [],
        sfxDock: null,
        selectedPlaylistId: null,
        masterVolume: DEFAULT_MASTER_VOLUME,
        fadeMs: DEFAULT_FADE_MS
      };
    }

    function normalizeState(next) {
      const playlists = (Array.isArray(next.playlists) ? next.playlists : [])
        .filter((playlist) => playlist && playlist.id && playlist.name)
        .map((playlist) => ({
          id: String(playlist.id),
          name: String(playlist.name).slice(0, 72),
          tracks: Array.isArray(playlist.tracks)
            ? playlist.tracks.map((track) => {
              const media = getMediaInfo(track.url || "");
              return {
                id: String(track.id || uid()),
                title: String(track.title || guessTitle(track.url || "")).slice(0, 96),
                url: String(track.url || ""),
                type: track.type || media.type,
                videoId: track.videoId || media.videoId || "",
                time: Number(track.time || 0),
                duration: Number(track.duration || 0),
                volume: clamp(Number(track.volume ?? 100), 0, 100),
                loop: Boolean(track.loop),
                createdAt: Number(track.createdAt || Date.now())
              };
            }).filter((track) => track.url)
            : []
        }));
      return {
        playlists,
        sfx: normalizeTracks(next.sfx || [], 72),
        sfxDock: normalizeDockPosition(next.sfxDock),
        selectedPlaylistId: playlists.some((playlist) => playlist.id === next.selectedPlaylistId)
          ? next.selectedPlaylistId
          : (playlists[0]?.id || null),
        masterVolume: clamp(Number(next.masterVolume ?? DEFAULT_MASTER_VOLUME), 0, 100),
        fadeMs: clamp(Number(next.fadeMs ?? DEFAULT_FADE_MS), 0, 6000)
      };
    }

    function normalizeTracks(tracks, titleLimit) {
      if (!Array.isArray(tracks)) return [];
      return tracks.map((track) => {
        const media = getMediaInfo(track.url || "");
        return {
          id: String(track.id || uid()),
          title: String(track.title || guessTitle(track.url || "")).slice(0, titleLimit),
          url: String(track.url || ""),
          type: track.type || media.type,
          videoId: track.videoId || media.videoId || "",
          time: Number(track.time || 0),
          duration: Number(track.duration || 0),
          volume: clamp(Number(track.volume ?? 100), 0, 100),
          loop: Boolean(track.loop),
          createdAt: Number(track.createdAt || Date.now())
        };
      }).filter((track) => track.url);
    }

    function normalizeDockPosition(position) {
      if (!position || !Number.isFinite(Number(position.x)) || !Number.isFinite(Number(position.y))) {
        return null;
      }
      return {
        x: Math.max(0, Number(position.x)),
        y: Math.max(0, Number(position.y))
      };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function queueSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveState, 180);
    }

    function render() {
      const selected = getSelectedPlaylist();
      const hasPlaylist = Boolean(selected);
      dom.activePlaylistTitle.textContent = selected?.name || "Nenhuma playlist";
      dom.statPlaylists.textContent = `${state.playlists.length} playlist${state.playlists.length === 1 ? "" : "s"}`;
      const totalTracks = state.playlists.reduce((sum, playlist) => sum + playlist.tracks.length, 0);
      dom.statTracks.textContent = `${totalTracks} música${totalTracks === 1 ? "" : "s"} · ${state.sfx.length} efeito${state.sfx.length === 1 ? "" : "s"}`;
      dom.clearTracksButton.disabled = !selected?.tracks.length;
      dom.resetSiteButton.disabled = !hasResettableContent();
      dom.trackTitle.disabled = !hasPlaylist;
      dom.trackUrl.disabled = !hasPlaylist;
      dom.trackPlaylist.disabled = !hasPlaylist;
      dom.trackSubmit.disabled = !hasPlaylist;

      dom.playlistList.innerHTML = state.playlists.length ? state.playlists.map((playlist) => `
        <div class="playlist-item ${playlist.id === state.selectedPlaylistId ? "is-active" : ""}">
          <button class="ghost" type="button" data-action="select-playlist" data-id="${escapeAttr(playlist.id)}" title="Selecionar playlist">
            <span class="playlist-name" title="Clique duplo para renomear">${escapeHtml(playlist.name)}</span>
            <span class="playlist-count">${playlist.tracks.length} música${playlist.tracks.length === 1 ? "" : "s"}</span>
          </button>
          <div class="mini-actions">
            <button class="icon-button" type="button" data-action="rename-playlist" data-id="${escapeAttr(playlist.id)}" title="Renomear playlist" aria-label="Renomear ${escapeAttr(playlist.name)}">
              <i data-lucide="pencil"></i>
            </button>
            <button class="icon-button" type="button" data-action="delete-playlist" data-id="${escapeAttr(playlist.id)}" title="Excluir playlist" aria-label="Excluir ${escapeAttr(playlist.name)}">
              <i data-lucide="trash-2"></i>
            </button>
          </div>
        </div>
      `).join("") : `<div class="playlist-empty">Nenhuma playlist.</div>`;

      dom.playlistList.querySelectorAll(".playlist-item > .ghost").forEach((button) => {
        button.style.display = "grid";
        button.style.gap = "2px";
        button.style.justifyItems = "start";
        button.style.textAlign = "left";
        button.style.border = "0";
        button.style.padding = "0";
        button.style.minHeight = "auto";
      });

      dom.trackPlaylist.innerHTML = state.playlists.length ? state.playlists.map((playlist) => `
        <option value="${escapeAttr(playlist.id)}" ${playlist.id === state.selectedPlaylistId ? "selected" : ""}>${escapeHtml(playlist.name)}</option>
      `).join("") : `<option value="">Crie uma playlist</option>`;

      if (!selected) {
        dom.trackList.innerHTML = `<div class="empty-state">Crie uma playlist para adicionar músicas.</div>`;
      } else if (!selected.tracks.length) {
        dom.trackList.innerHTML = `<div class="empty-state">Nenhuma música nesta playlist.</div>`;
      } else {
        dom.trackList.innerHTML = selected.tracks.map((track) => trackTemplate(track)).join("");
      }

      dom.exportList.innerHTML = state.playlists.map((playlist) => `
        <label class="check-row">
          <input type="checkbox" class="export-check" value="${escapeAttr(playlist.id)}" ${playlist.id === state.selectedPlaylistId ? "checked" : ""}>
          <span>${escapeHtml(playlist.name)}</span>
        </label>
      `).join("") + `
        <label class="check-row">
          <input type="checkbox" class="export-sfx-check" value="sfx">
          <span>Efeitos sonoros</span>
        </label>
      `;

      dom.masterVolume.value = state.masterVolume;
      dom.fadeDuration.value = state.fadeMs;
      dom.volumeValue.textContent = `${state.masterVolume}%`;
      dom.fadeValue.textContent = `${(state.fadeMs / 1000).toFixed(1)}s`;
      renderNowPlaying();
      renderSfx();
      renderYoutubeNotice();
      renderYoutubeSessionStatus();
      refreshIcons();
    }

    function clearSelectedPlaylistTracks() {
      const playlist = getSelectedPlaylist();
      const count = playlist?.tracks?.length || 0;
      if (!playlist || !count) {
        toast("Nenhuma faixa para limpar.");
        return;
      }
      const label = count === 1 ? "1 faixa" : `${count} faixas`;
      if (!confirm(`Remover ${label} de "${playlist.name}"?`)) return;

      const ids = new Set(playlist.tracks.map((track) => track.id));
      if (current.trackId && ids.has(current.trackId)) {
        ++switchToken;
        pauseEngine();
        seekEngine(0);
        current = { trackId: null, type: null, playing: false };
      }
      playlist.tracks = [];
      saveState();
      render();
      toast(`${label} removida${count === 1 ? "" : "s"}.`);
    }

    function resetSite() {
      if (!hasResettableContent()) {
        toast("O site já está vazio.");
        return;
      }
      if (!confirm("Apagar todas as playlists, músicas e efeitos sonoros e voltar o site ao zero?")) return;

      ++switchToken;
      pauseEngine();
      seekEngine(0);
      stopYoutube();
      audio.pause();
      audio.removeAttribute("src");
      stopAllSfx(true);
      dom.sfxYoutubePool.innerHTML = "";
      current = { trackId: null, type: null, playing: false };
      state = createEmptyState();
      clearSfxDockPosition();
      clearForms();
      saveState();
      render();
      toast("Tudo limpo. Site zerado.");
    }

    function hasResettableContent() {
      return state.playlists.length > 0
        || state.sfx.length > 0
        || Boolean(state.sfxDock)
        || state.masterVolume !== DEFAULT_MASTER_VOLUME
        || state.fadeMs !== DEFAULT_FADE_MS
        || Boolean(current.trackId)
        || sfxPlayers.size > 0;
    }

    function clearForms() {
      dom.playlistName.value = "";
      dom.trackTitle.value = "";
      dom.trackUrl.value = "";
      dom.sfxTitle.value = "";
      dom.sfxUrl.value = "";
      dom.importInput.value = "";
      dom.exportOutput.value = "";
    }

    function clearSfxDockPosition() {
      sfxDockDrag = null;
      dom.sfxDock.classList.remove("is-dragging");
      dom.sfxDock.style.left = "";
      dom.sfxDock.style.top = "";
      dom.sfxDock.style.right = "";
      dom.sfxDock.style.bottom = "";
      dom.sfxDock.style.width = "";
    }

    function trackTemplate(track) {
      const isCurrent = current.trackId === track.id;
      const isPlaying = isCurrent && current.playing;
      const pct = track.duration ? clamp((track.time / track.duration) * 100, 0, 100) : 0;
      const sliderMax = getSliderMax(track);
      return `
        <article class="track-card ${isPlaying ? "is-playing" : ""}" data-track-id="${escapeAttr(track.id)}">
          <button class="play-button" type="button" data-action="play-track" data-id="${escapeAttr(track.id)}" title="${isPlaying ? "Pausar" : "Tocar"}" aria-label="${isPlaying ? "Pausar" : "Tocar"} ${escapeAttr(track.title)}">
            <i data-lucide="${isPlaying ? "pause" : "play"}"></i>
          </button>
          <div class="track-meta">
            <p class="track-title" title="Clique duplo para renomear">${escapeHtml(track.title)}</p>
            <div class="track-url">${escapeHtml(track.url)}</div>
          </div>
          <div class="mini-actions">
            <button class="icon-button" type="button" data-action="reset-time" data-id="${escapeAttr(track.id)}" title="Zerar tempo" aria-label="Zerar tempo de ${escapeAttr(track.title)}">
              <i data-lucide="rotate-ccw"></i>
            </button>
            <button class="icon-button" type="button" data-action="rename-track" data-id="${escapeAttr(track.id)}" title="Renomear música" aria-label="Renomear ${escapeAttr(track.title)}">
              <i data-lucide="pencil"></i>
            </button>
            <button class="icon-button" type="button" data-action="delete-track" data-id="${escapeAttr(track.id)}" title="Remover música" aria-label="Remover ${escapeAttr(track.title)}">
              <i data-lucide="trash-2"></i>
            </button>
          </div>
          <div class="track-controls">
            <div class="control-cell">
              <label for="seek-${escapeAttr(track.id)}">Linha do tempo</label>
              <div class="range-row">
                <input id="seek-${escapeAttr(track.id)}" type="range" min="0" max="${sliderMax}" step="1" value="${Math.min(track.time, sliderMax)}" data-action="seek-track" data-id="${escapeAttr(track.id)}">
                <span class="range-value" data-track-time="${escapeAttr(track.id)}">${formatTime(track.time)}${track.duration ? ` / ${formatTime(track.duration)}` : ""}</span>
              </div>
              <div class="progress" aria-hidden="true"><span data-track-progress="${escapeAttr(track.id)}" style="width:${pct}%"></span></div>
            </div>
            <div class="control-cell">
              <label for="volume-${escapeAttr(track.id)}">Volume</label>
              <div class="range-row">
                <input id="volume-${escapeAttr(track.id)}" type="range" min="0" max="100" step="1" value="${track.volume}" data-action="volume-track" data-id="${escapeAttr(track.id)}">
                <span class="range-value" data-volume-value="${escapeAttr(track.id)}">${track.volume}%</span>
              </div>
            </div>
            <label class="loop-pill">
              <input type="checkbox" data-action="loop-track" data-id="${escapeAttr(track.id)}" ${track.loop ? "checked" : ""}>
              Loop
            </label>
          </div>
        </article>
      `;
    }

    async function playTrack(trackId) {
      const track = findTrack(trackId);
      if (!track) return;

      if (current.trackId === trackId && current.playing) {
        await pauseActive(true);
        return;
      }

      const token = ++switchToken;
      await fadeOutCurrent(token);
      if (token !== switchToken) return;

      current = { trackId, type: track.type, playing: true };
      renderNowPlaying();

      try {
        if (track.type === "youtube") {
          await startYoutube(track);
        } else {
          await startAudio(track);
        }
        if (token !== switchToken) return;
        await fadeTo(getTrackOutputVolume(track), state.fadeMs, token);
        syncTimeViews();
        render();
      } catch (error) {
        current = { trackId: null, type: null, playing: false };
        renderNowPlaying();
        toast(error.message || "Não foi possível tocar essa música.");
      }
    }

    async function startAudio(track) {
      stopYoutube();
      dom.youtubeShell.classList.remove("is-visible");
      dom.audioShell.classList.remove("is-hidden");
      dom.audioShell.classList.remove("is-youtube");
      audio.src = track.url;
      audio.currentTime = Math.max(0, Number(track.time || 0));
      audio.volume = 0;
      audio.loop = Boolean(track.loop);
      await audio.play();
    }

    async function startYoutube(track) {
      if (isFilePage) {
        renderYoutubeNotice(youtubeLocalMessage);
        throw new Error(youtubeLocalMessage);
      }
      audio.pause();
      audio.removeAttribute("src");
      dom.audioShell.classList.remove("is-hidden");
      dom.audioShell.classList.add("is-youtube");
      dom.youtubeShell.classList.add("is-visible");
      await ensureYoutubeReady();
      patchYoutubeIframe(ytPlayer);
      ytPlayer.setVolume(0);
      ytPlayer.loadVideoById({ videoId: track.videoId, startSeconds: Math.max(0, Number(track.time || 0)) });
      ytPlayer.playVideo();
    }

    async function pauseActive(withFade) {
      if (!current.trackId) return;
      const token = ++switchToken;
      saveCurrentTime(true);
      if (withFade) await fadeTo(0, Math.min(state.fadeMs, 1200), token);
      pauseEngine();
      current.playing = false;
      saveState();
      render();
      toast("Pausado.");
    }

    async function togglePauseActive() {
      if (!current.trackId) return;
      if (current.playing) {
        await pauseActive(true);
      } else {
        await resumeActive();
      }
    }

    async function resumeActive() {
      const track = findTrack(current.trackId);
      if (!track) return;
      const token = ++switchToken;
      current.playing = true;
      try {
        if (current.type === "audio") {
          audio.volume = 0;
          await audio.play();
        } else if (current.type === "youtube" && ytPlayer && ytReady) {
          ytPlayer.setVolume(0);
          ytPlayer.playVideo();
        }
        await fadeTo(getTrackOutputVolume(track), state.fadeMs, token);
        render();
        toast("Tocando.");
      } catch (error) {
        current.playing = false;
        render();
        toast(error.message || "Não foi possível retomar.");
      }
    }

    async function fadeOutCurrent(token) {
      if (!current.trackId) return;
      saveCurrentTime(true);
      if (current.playing) {
        await fadeTo(0, Math.min(state.fadeMs, 1200), token);
      }
      pauseEngine();
      current = { trackId: null, type: null, playing: false };
    }

    function stopActive() {
      if (!current.trackId) return;
      const track = findTrack(current.trackId);
      if (track) track.time = 0;
      ++switchToken;
      pauseEngine();
      seekEngine(0);
      current = { trackId: null, type: null, playing: false };
      saveState();
      render();
      toast("Parado.");
    }

    function pauseEngine() {
      if (current.type === "audio") audio.pause();
      if (current.type === "youtube" && ytPlayer && ytReady) ytPlayer.pauseVideo();
    }

    function seekEngine(seconds) {
      if (current.type === "audio") {
        try { audio.currentTime = seconds; } catch {}
      }
      if (current.type === "youtube" && ytPlayer && ytReady) {
        ytPlayer.seekTo(seconds, true);
      }
    }

    function seekActive(seconds) {
      const track = findTrack(current.trackId);
      if (!track) return;
      track.time = seconds;
      seekEngine(seconds);
      syncTimeViews();
    }

    function stopYoutube() {
      if (ytPlayer && ytReady) {
        try {
          ytPlayer.pauseVideo();
          ytPlayer.seekTo(0, true);
        } catch {}
      }
    }

    function handleTrackEnded() {
      const track = findTrack(current.trackId);
      if (track?.loop) {
        track.time = 0;
        seekEngine(0);
        if (current.type === "youtube" && ytPlayer && ytReady) ytPlayer.playVideo();
        return;
      }
      if (track) track.time = 0;
      current.playing = false;
      saveState();
      render();
    }

    function saveCurrentTime(force) {
      const track = findTrack(current.trackId);
      if (!track) return;
      const seconds = getActiveTime();
      if (Number.isFinite(seconds)) {
        track.time = Math.max(0, seconds);
      }
      const duration = getActiveDuration();
      if (Number.isFinite(duration) && duration > 0) {
        track.duration = duration;
      }
      if (force) saveState();
      else queueSave();
    }

    function getActiveTime() {
      if (current.type === "audio") return audio.currentTime || 0;
      if (current.type === "youtube" && ytPlayer && ytReady && typeof ytPlayer.getCurrentTime === "function") {
        return ytPlayer.getCurrentTime() || 0;
      }
      return 0;
    }

    function getActiveDuration() {
      if (current.type === "audio") return audio.duration || 0;
      if (current.type === "youtube" && ytPlayer && ytReady && typeof ytPlayer.getDuration === "function") {
        return ytPlayer.getDuration() || 0;
      }
      return 0;
    }

    async function fadeTo(target, duration, token) {
      const start = getActiveVolume();
      const end = clamp(target, 0, 1);
      if (!duration || Math.abs(start - end) < 0.01) {
        setActiveVolume(end);
        return;
      }
      const started = performance.now();
      await new Promise((resolve) => {
        function frame(now) {
          if (token !== switchToken) {
            resolve();
            return;
          }
          const pct = clamp((now - started) / duration, 0, 1);
          const eased = pct < 0.5 ? 2 * pct * pct : 1 - Math.pow(-2 * pct + 2, 2) / 2;
          setActiveVolume(start + (end - start) * eased);
          if (pct < 1) requestAnimationFrame(frame);
          else resolve();
        }
        requestAnimationFrame(frame);
      });
    }

    function setActiveVolume(value) {
      const safe = clamp(value, 0, 1);
      if (current.type === "audio") audio.volume = safe;
      if (current.type === "youtube" && ytPlayer && ytReady) ytPlayer.setVolume(Math.round(safe * 100));
    }

    function getActiveVolume() {
      if (current.type === "audio") return audio.volume || 0;
      if (current.type === "youtube" && ytPlayer && ytReady && typeof ytPlayer.getVolume === "function") {
        return (ytPlayer.getVolume() || 0) / 100;
      }
      return 0;
    }

    function getTrackOutputVolume(track) {
      return clamp((state.masterVolume / 100) * ((track?.volume ?? 100) / 100), 0, 1);
    }

    function getYoutubePlayerVars(extra = {}) {
      const vars = {
        playsinline: 1,
        rel: 0,
        enablejsapi: 1,
        modestbranding: 1,
        iv_load_policy: 3,
        fs: 0,
        cc_load_policy: 0,
        autoplay: 1,
        ...extra
      };
      if (window.location.origin && window.location.origin !== "null") {
        vars.origin = window.location.origin;
      }
      return vars;
    }

    function patchYoutubeIframe(player) {
      try {
        const iframe = player?.getIframe?.();
        if (!iframe) return;
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.allow = "autoplay; encrypted-media; picture-in-picture";
        iframe.setAttribute("allowfullscreen", "");
      } catch {}
    }

    function renderYoutubeNotice(message) {
      if (!dom.youtubeNotice) return;
      const text = message || (isFilePage ? youtubeLocalMessage : "");
      dom.youtubeNotice.textContent = text;
      dom.youtubeNotice.classList.toggle("hidden", !text);
    }

    function renderYoutubeSessionStatus(mode, customMessage) {
      if (!dom.youtubeStatus || !dom.youtubeStatusText) return;
      let state = "idle";
      let text = "Login não verificável pelo site. Entre no YouTube neste navegador para o Premium valer no player.";

      if (isFilePage) {
        state = "warning";
        text = "Abra por localhost ou GitHub Pages para o YouTube usar a sessão do navegador.";
      } else if (mode === "error" || ytApiFailed) {
        state = "error";
        text = customMessage || "YouTube não carregou. Verifique a conexão ou bloqueadores.";
      } else if (mode === "loading" || (ytApiRequested && !ytReady)) {
        state = "loading";
        text = "Carregando player do YouTube...";
      } else if (mode === "login-opened") {
        state = "loading";
        text = "Entrando pelo YouTube. Volte para esta aba depois do login.";
      } else if (mode === "returned") {
        state = "ready";
        text = "Se a conta Premium ficou logada neste navegador, o player usa essa sessão.";
      } else if (ytReady) {
        state = "ready";
        text = "Player pronto em youtube.com. Premium depende da conta logada no navegador.";
      }

      dom.youtubeStatus.dataset.state = state;
      dom.youtubeStatusText.textContent = text;
    }

    function getYoutubeErrorMessage(code, title) {
      if (code === 153) {
        if (isFilePage) return youtubeLocalMessage;
        return `O YouTube bloqueou "${title}" por falta de referer/origem no embed. No GitHub Pages normalmente funciona; se persistir, teste sem bloqueador de anúncios ou use um link .mp3 direto.`;
      }
      if (code === 101 || code === 150) return `O dono do vídeo não permite tocar "${title}" fora do YouTube.`;
      if (code === 100) return `O vídeo "${title}" foi removido, está privado ou não existe.`;
      if (code === 2) return `O link do YouTube em "${title}" parece inválido.`;
      return `O YouTube não conseguiu tocar "${title}" (erro ${code}).`;
    }

    function handleYoutubeError(code, title) {
      const message = getYoutubeErrorMessage(code, title);
      renderYoutubeNotice(message);
      toast(message);
      if (current.type === "youtube") {
        current.playing = false;
        renderNowPlaying();
      }
    }

    function requestYoutubeApi() {
      if (ytReady || ytApiRequested) {
        if (window.YT?.Player && !ytPlayer) createYoutubePlayer();
        return;
      }
      ytApiRequested = true;
      ytApiFailed = false;
      renderYoutubeSessionStatus("loading");

      if (window.YT?.Player) {
        createYoutubePlayer();
        return;
      }

      const ytScript = document.createElement("script");
      ytScript.src = "https://www.youtube.com/iframe_api";
      ytScript.async = true;
      ytScript.onerror = () => {
        ytApiFailed = true;
        ytApiRequested = false;
        const error = new Error("YouTube não carregou. Verifique a conexão ou bloqueadores.");
        renderYoutubeSessionStatus("error", error.message);
        settleYoutubeWaiters(error);
      };
      document.head.appendChild(ytScript);
    }

    function settleYoutubeWaiters(error) {
      const waiters = ytWaiters.splice(0);
      waiters.forEach((waiter) => {
        if (error) waiter.reject(error);
        else waiter.resolve();
      });
    }

    function ensureYoutubeReady() {
      if (ytReady) return Promise.resolve();
      if (ytApiFailed) {
        ytApiFailed = false;
        ytApiRequested = false;
      }
      requestYoutubeApi();
      return new Promise((resolve, reject) => {
        const waiter = { resolve, reject };
        ytWaiters.push(waiter);
        setTimeout(() => {
          const index = ytWaiters.indexOf(waiter);
          if (index < 0 || ytReady) return;
          ytWaiters.splice(index, 1);
          const error = new Error("YouTube ainda não carregou. Tente de novo em alguns segundos.");
          renderYoutubeSessionStatus("error", error.message);
          reject(error);
        }, 9000);
      });
    }

    function syncTimeViews() {
      const track = findTrack(current.trackId);
      if (!track) {
        renderNowPlaying();
        return;
      }
      const pct = track.duration ? clamp((track.time / track.duration) * 100, 0, 100) : 0;
      document.querySelectorAll(`[data-track-time="${cssEscape(track.id)}"]`).forEach((node) => {
        node.textContent = `${formatTime(track.time)}${track.duration ? ` / ${formatTime(track.duration)}` : ""}`;
      });
      document.querySelectorAll(`[data-track-progress="${cssEscape(track.id)}"]`).forEach((node) => {
        node.style.width = `${pct}%`;
      });
      document.querySelectorAll(`[data-action="seek-track"][data-id="${cssEscape(track.id)}"]`).forEach((node) => {
        const max = getSliderMax(track);
        node.max = String(max);
        node.value = String(Math.min(track.time, max));
      });
      renderNowPlaying();
    }

    function syncVolumeViews(track) {
      if (!track) return;
      document.querySelectorAll(`[data-volume-value="${cssEscape(track.id)}"]`).forEach((node) => {
        node.textContent = `${track.volume}%`;
      });
    }

    function getSliderMax(track) {
      return Math.max(60, Math.ceil(track.duration || track.time || 0), 600);
    }

    function renderNowPlaying() {
      const track = findTrack(current.trackId);
      const pauseLabel = document.querySelector("#pause-button-label");
      const pauseIcon = document.querySelector("#pause-button-icon");
      if (!track) {
        dom.currentTitle.textContent = "Nada tocando";
        dom.currentSubtitle.textContent = "Selecione uma música.";
        dom.currentTime.textContent = "00:00";
        dom.currentProgress.style.width = "0%";
        dom.pauseButton.disabled = true;
        dom.stopButton.disabled = true;
        dom.youtubeShell.classList.remove("is-visible");
        dom.audioShell.classList.remove("is-hidden");
        dom.audioShell.classList.remove("is-youtube");
        if (pauseLabel) pauseLabel.textContent = "Pausar";
        if (pauseIcon) pauseIcon.setAttribute("data-lucide", "pause");
        return;
      }
      const playlist = findPlaylistByTrack(track.id);
      const pct = track.duration ? clamp((track.time / track.duration) * 100, 0, 100) : 0;
      dom.currentTitle.textContent = track.title;
      dom.currentSubtitle.textContent = `${playlist ? playlist.name : "Playlist"} · ${track.type === "youtube" ? "YouTube" : "MP3/Audio"}`;
      dom.currentTime.textContent = `${formatTime(track.time)}${track.duration ? ` / ${formatTime(track.duration)}` : ""}`;
      dom.currentProgress.style.width = `${pct}%`;
      dom.pauseButton.disabled = false;
      dom.stopButton.disabled = false;
      if (pauseLabel) pauseLabel.textContent = current.playing ? "Pausar" : "Tocar";
      if (pauseIcon) pauseIcon.setAttribute("data-lucide", current.playing ? "pause" : "play");
      dom.youtubeShell.classList.toggle("is-visible", track.type === "youtube");
      dom.audioShell.classList.remove("is-hidden");
      dom.audioShell.classList.toggle("is-youtube", track.type === "youtube");
    }

    function renderSfx() {
      dom.sfxCount.textContent = `(${state.sfx.length})`;
      if (!state.sfx.length) {
        dom.sfxList.innerHTML = `<div class="empty-state">Sem efeitos ainda.</div>`;
        applySfxDockPosition(true);
        refreshIcons();
        return;
      }
      dom.sfxList.innerHTML = state.sfx.map((effect) => sfxTemplate(effect)).join("");
      applySfxDockPosition(true);
      refreshIcons();
    }

    function sfxTemplate(effect) {
      const isPlaying = Boolean(sfxPlayers.get(effect.id)?.playing);
      const pct = effect.duration ? clamp((effect.time / effect.duration) * 100, 0, 100) : 0;
      const sliderMax = getSliderMax(effect);
      return `
        <article class="sfx-card ${isPlaying ? "is-playing" : ""}" data-sfx-id="${escapeAttr(effect.id)}">
          <button class="sfx-play" type="button" data-action="play-sfx" data-id="${escapeAttr(effect.id)}" title="${isPlaying ? "Pausar efeito" : "Tocar efeito"}" aria-label="${isPlaying ? "Pausar" : "Tocar"} ${escapeAttr(effect.title)}">
            <i data-lucide="${isPlaying ? "pause" : "play"}"></i>
          </button>
          <div class="track-meta">
            <p class="sfx-title" title="Clique duplo para renomear">${escapeHtml(effect.title)}</p>
            <div class="sfx-url">${escapeHtml(effect.url)}</div>
          </div>
          <div class="mini-actions">
            <button class="icon-button" type="button" data-action="reset-sfx" data-id="${escapeAttr(effect.id)}" title="Zerar tempo" aria-label="Zerar tempo de ${escapeAttr(effect.title)}">
              <i data-lucide="rotate-ccw"></i>
            </button>
            <button class="icon-button" type="button" data-action="rename-sfx" data-id="${escapeAttr(effect.id)}" title="Renomear efeito" aria-label="Renomear ${escapeAttr(effect.title)}">
              <i data-lucide="pencil"></i>
            </button>
            <button class="icon-button" type="button" data-action="delete-sfx" data-id="${escapeAttr(effect.id)}" title="Remover efeito" aria-label="Remover ${escapeAttr(effect.title)}">
              <i data-lucide="trash-2"></i>
            </button>
          </div>
          <div class="sfx-controls">
            <div class="control-cell">
              <label for="seek-sfx-${escapeAttr(effect.id)}">Tempo</label>
              <div class="range-row">
                <input id="seek-sfx-${escapeAttr(effect.id)}" type="range" min="0" max="${sliderMax}" step="1" value="${Math.min(effect.time, sliderMax)}" data-action="seek-sfx" data-id="${escapeAttr(effect.id)}">
                <span class="range-value" data-sfx-time="${escapeAttr(effect.id)}">${formatTime(effect.time)}${effect.duration ? ` / ${formatTime(effect.duration)}` : ""}</span>
              </div>
              <div class="progress" aria-hidden="true"><span data-sfx-progress="${escapeAttr(effect.id)}" style="width:${pct}%"></span></div>
            </div>
            <div class="control-cell">
              <label for="volume-sfx-${escapeAttr(effect.id)}">Volume</label>
              <div class="range-row">
                <input id="volume-sfx-${escapeAttr(effect.id)}" type="range" min="0" max="100" step="1" value="${effect.volume}" data-action="volume-sfx" data-id="${escapeAttr(effect.id)}">
                <span class="range-value" data-volume-value="${escapeAttr(effect.id)}">${effect.volume}%</span>
              </div>
            </div>
            <label class="loop-pill">
              <input type="checkbox" data-action="loop-sfx" data-id="${escapeAttr(effect.id)}" ${effect.loop ? "checked" : ""}>
              Loop
            </label>
          </div>
        </article>
      `;
    }

    function startSfxDockDrag(event) {
      if (event.button !== undefined && event.button !== 0) return;
      if (event.target.closest("button, input, textarea, select, a")) return;
      const rect = dom.sfxDock.getBoundingClientRect();
      sfxDockDrag = {
        offsetX: event.clientX - rect.left,
        offsetY: event.clientY - rect.top,
        width: rect.width,
        height: rect.height
      };
      dom.sfxDock.classList.add("is-dragging");
      dom.sfxDock.style.width = `${rect.width}px`;
      dom.sfxDragHandle.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    }

    function moveSfxDock(event) {
      if (!sfxDockDrag) return;
      const position = clampDockPosition(
        event.clientX - sfxDockDrag.offsetX,
        event.clientY - sfxDockDrag.offsetY,
        sfxDockDrag.width,
        sfxDockDrag.height
      );
      setSfxDockPosition(position);
      state.sfxDock = position;
    }

    function endSfxDockDrag(event) {
      if (!sfxDockDrag) return;
      dom.sfxDock.classList.remove("is-dragging");
      try {
        dom.sfxDragHandle.releasePointerCapture?.(event.pointerId);
      } catch {}
      dom.sfxDock.style.width = "";
      sfxDockDrag = null;
      saveState();
    }

    function applySfxDockPosition(shouldClamp) {
      if (!state.sfxDock) return;
      const rect = dom.sfxDock.getBoundingClientRect();
      const position = shouldClamp
        ? clampDockPosition(state.sfxDock.x, state.sfxDock.y, rect.width, rect.height)
        : state.sfxDock;
      setSfxDockPosition(position);
      state.sfxDock = position;
      queueSave();
    }

    function setSfxDockPosition(position) {
      dom.sfxDock.style.left = `${position.x}px`;
      dom.sfxDock.style.top = `${position.y}px`;
      dom.sfxDock.style.right = "auto";
      dom.sfxDock.style.bottom = "auto";
    }

    function clampDockPosition(x, y, width, height) {
      const margin = 10;
      const maxX = Math.max(margin, window.innerWidth - width - margin);
      const maxY = Math.max(margin, window.innerHeight - Math.min(height, window.innerHeight - margin * 2) - margin);
      return {
        x: clamp(x, margin, maxX),
        y: clamp(y, margin, maxY)
      };
    }

    async function toggleSfx(effectId) {
      const engine = sfxPlayers.get(effectId);
      if (engine?.playing) {
        pauseSfx(effectId);
        return;
      }
      await playSfx(effectId);
    }

    async function playSfx(effectId) {
      const effect = findSfx(effectId);
      if (!effect) return;
      try {
        const engine = effect.type === "youtube"
          ? await ensureSfxYoutubeEngine(effect)
          : ensureSfxAudioEngine(effect);
        if (engine.type === "audio") {
          engine.audio.loop = Boolean(effect.loop);
          engine.audio.volume = effect.volume / 100;
          engine.audio.currentTime = Math.max(0, Number(effect.time || 0));
          await engine.audio.play();
        } else {
          engine.player.setVolume(effect.volume);
          engine.player.loadVideoById({ videoId: effect.videoId, startSeconds: Math.max(0, Number(effect.time || 0)) });
          engine.player.playVideo();
        }
        engine.playing = true;
        renderSfx();
      } catch (error) {
        toast(error.message || "Não foi possível tocar esse efeito.");
      }
    }

    function ensureSfxAudioEngine(effect) {
      const existing = sfxPlayers.get(effect.id);
      if (existing?.audio) return existing;
      const effectAudio = new Audio(effect.url);
      effectAudio.preload = "auto";
      const engine = { type: "audio", audio: effectAudio, playing: false };
      effectAudio.addEventListener("loadedmetadata", () => {
        if (Number.isFinite(effectAudio.duration)) {
          effect.duration = effectAudio.duration;
          queueSave();
          syncSfxViews();
        }
      });
      effectAudio.addEventListener("ended", () => {
        if (effect.loop) return;
        effect.time = 0;
        stopSfx(effect.id, true);
      });
      sfxPlayers.set(effect.id, engine);
      return engine;
    }

    async function ensureSfxYoutubeEngine(effect) {
      if (isFilePage) {
        renderYoutubeNotice(youtubeLocalMessage);
        throw new Error(youtubeLocalMessage);
      }
      const existing = sfxPlayers.get(effect.id);
      if (existing?.player) return existing;
      await ensureYoutubeReady();
      const host = document.createElement("div");
      host.id = `sfx-yt-${effect.id}`;
      dom.sfxYoutubePool.appendChild(host);
      const engine = { type: "youtube", hostId: host.id, player: null, playing: false };
      sfxPlayers.set(effect.id, engine);
      await new Promise((resolve) => {
        engine.player = new YT.Player(host.id, {
          host: YOUTUBE_EMBED_HOST,
          width: "1",
          height: "1",
          playerVars: getYoutubePlayerVars({
            controls: 0,
            disablekb: 1
          }),
          events: {
            onReady: (event) => {
              patchYoutubeIframe(event.target);
              resolve();
            },
            onStateChange: (event) => {
              if (event.data !== YT.PlayerState.ENDED) return;
              const latest = findSfx(effect.id);
              if (latest?.loop) {
                latest.time = 0;
                engine.player.seekTo(0, true);
                engine.player.playVideo();
              } else {
                if (latest) latest.time = 0;
                stopSfx(effect.id, true);
              }
            },
            onError: (event) => handleYoutubeError(event.data, effect.title)
          }
        });
      });
      return engine;
    }

    function pauseSfx(effectId) {
      const effect = findSfx(effectId);
      const engine = sfxPlayers.get(effectId);
      if (!effect || !engine) return;
      effect.time = getSfxTime(effectId);
      if (engine.audio) engine.audio.pause();
      if (engine.player) engine.player.pauseVideo();
      engine.playing = false;
      saveState();
      renderSfx();
    }

    function stopSfx(effectId, resetTime) {
      const effect = findSfx(effectId);
      const engine = sfxPlayers.get(effectId);
      if (effect) {
        effect.time = resetTime ? 0 : getSfxTime(effectId);
      }
      if (engine?.audio) {
        engine.audio.pause();
        engine.audio.removeAttribute("src");
      }
      if (engine?.player) {
        try {
          engine.player.stopVideo();
          engine.player.destroy();
        } catch {}
      }
      if (engine?.hostId) {
        document.getElementById(engine.hostId)?.remove();
      }
      sfxPlayers.delete(effectId);
      saveState();
      renderSfx();
    }

    function stopAllSfx(resetTime) {
      Array.from(sfxPlayers.keys()).forEach((id) => stopSfx(id, resetTime));
    }

    function seekSfx(effectId, seconds) {
      const engine = sfxPlayers.get(effectId);
      if (engine?.audio) {
        try { engine.audio.currentTime = seconds; } catch {}
      }
      if (engine?.player) {
        engine.player.seekTo(seconds, true);
      }
    }

    function setSfxVolume(effectId) {
      const effect = findSfx(effectId);
      const engine = sfxPlayers.get(effectId);
      if (!effect || !engine) return;
      if (engine.audio) engine.audio.volume = effect.volume / 100;
      if (engine.player) engine.player.setVolume(effect.volume);
    }

    function saveSfxTimes(force) {
      for (const [id, engine] of sfxPlayers) {
        if (!engine.playing) continue;
        const effect = findSfx(id);
        if (!effect) continue;
        const seconds = getSfxTime(id);
        if (Number.isFinite(seconds)) effect.time = Math.max(0, seconds);
        const duration = getSfxDuration(id);
        if (Number.isFinite(duration) && duration > 0) effect.duration = duration;
      }
      if (force) saveState();
      else queueSave();
    }

    function syncSfxViews() {
      for (const effect of state.sfx) {
        const pct = effect.duration ? clamp((effect.time / effect.duration) * 100, 0, 100) : 0;
        document.querySelectorAll(`[data-sfx-time="${cssEscape(effect.id)}"]`).forEach((node) => {
          node.textContent = `${formatTime(effect.time)}${effect.duration ? ` / ${formatTime(effect.duration)}` : ""}`;
        });
        document.querySelectorAll(`[data-sfx-progress="${cssEscape(effect.id)}"]`).forEach((node) => {
          node.style.width = `${pct}%`;
        });
        document.querySelectorAll(`[data-action="seek-sfx"][data-id="${cssEscape(effect.id)}"]`).forEach((node) => {
          const max = getSliderMax(effect);
          node.max = String(max);
          node.value = String(Math.min(effect.time, max));
        });
      }
    }

    function getSfxTime(effectId) {
      const engine = sfxPlayers.get(effectId);
      if (engine?.audio) return engine.audio.currentTime || 0;
      if (engine?.player && typeof engine.player.getCurrentTime === "function") return engine.player.getCurrentTime() || 0;
      return findSfx(effectId)?.time || 0;
    }

    function getSfxDuration(effectId) {
      const engine = sfxPlayers.get(effectId);
      if (engine?.audio) return engine.audio.duration || 0;
      if (engine?.player && typeof engine.player.getDuration === "function") return engine.player.getDuration() || 0;
      return findSfx(effectId)?.duration || 0;
    }

    function buildExportText() {
      const selectedIds = Array.from(document.querySelectorAll(".export-check:checked")).map((input) => input.value);
      const includeSfx = Boolean(document.querySelector(".export-sfx-check:checked"));
      const ids = selectedIds.length || includeSfx ? selectedIds : [state.selectedPlaylistId];
      const lines = [];
      for (const playlist of state.playlists) {
        if (!ids.includes(playlist.id)) continue;
        for (const track of playlist.tracks) {
          lines.push(`{titulo=${quoteValue(track.title)}, link=${quoteValue(track.url)}, playlist=${quoteValue(playlist.name)}, volume=${track.volume}, loop=${track.loop ? "sim" : "nao"}}`);
        }
      }
      if (includeSfx) {
        for (const effect of state.sfx) {
          lines.push(`{titulo=${quoteValue(effect.title)}, link=${quoteValue(effect.url)}, playlist="Efeitos sonoros", tipo="efeito", volume=${effect.volume}, loop=${effect.loop ? "sim" : "nao"}}`);
        }
      }
      return lines.join("\n");
    }

    function importText(text) {
      const lines = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      let count = 0;
      for (const line of lines) {
        const record = parseRecord(line);
        const title = record.titulo || record.title || "";
        const url = record.link || record.url || "";
        const selectedPlaylist = getSelectedPlaylist();
        const playlistName = record.playlist || record.plalist || record.lista || selectedPlaylist?.name || "Importadas";
        const isEffect = ["efeito", "sfx", "effect"].includes(String(record.tipo || record.type || "").toLowerCase())
          || String(playlistName).toLowerCase() === "efeitos sonoros";
        if (!url) continue;
        const media = getMediaInfo(url);
        if (media.type === "youtube" && !media.videoId) continue;
        const imported = {
          id: uid(),
          title: (title || guessTitle(url)).slice(0, isEffect ? 72 : 96),
          url,
          type: media.type,
          videoId: media.videoId || "",
          time: 0,
          duration: 0,
          volume: clamp(Number(record.volume ?? 100), 0, 100),
          loop: parseBool(record.loop),
          createdAt: Date.now()
        };
        if (isEffect) {
          state.sfx.push(imported);
          count += 1;
          continue;
        }
        let playlist = state.playlists.find((item) => item.name.toLowerCase() === playlistName.toLowerCase());
        if (!playlist) {
          playlist = { id: uid(), name: playlistName.slice(0, 72), tracks: [] };
          state.playlists.push(playlist);
        }
        playlist.tracks.push(imported);
        state.selectedPlaylistId = playlist.id;
        count += 1;
      }
      return { count };
    }

    function parseRecord(line) {
      const record = {};
      const body = line.replace(/^\{/, "").replace(/\}$/, "");
      const pattern = /([a-zA-Z_]+)\s*=\s*(?:"((?:\\"|[^"])*)"|'((?:\\'|[^'])*)'|([^,}]+))/g;
      let match;
      while ((match = pattern.exec(body))) {
        const key = match[1].trim().toLowerCase();
        const value = (match[2] ?? match[3] ?? match[4] ?? "").trim().replace(/\\"/g, '"').replace(/\\'/g, "'");
        record[key] = value;
      }
      return record;
    }

    function parseBool(value) {
      return ["sim", "true", "1", "yes", "loop"].includes(String(value || "").trim().toLowerCase());
    }

    function getSelectedPlaylist() {
      return getPlaylist(state.selectedPlaylistId) || state.playlists[0];
    }

    function getPlaylist(id) {
      return state.playlists.find((playlist) => playlist.id === id);
    }

    function findTrack(id) {
      for (const playlist of state.playlists) {
        const track = playlist.tracks.find((item) => item.id === id);
        if (track) return track;
      }
      return null;
    }

    function findPlaylistByTrack(trackId) {
      return state.playlists.find((playlist) => playlist.tracks.some((track) => track.id === trackId));
    }

    function findSfx(id) {
      return state.sfx.find((effect) => effect.id === id);
    }

    function getMediaInfo(url) {
      const videoId = parseYoutubeId(url);
      if (videoId) return { type: "youtube", videoId };
      if (/youtu\.?be|youtube\.com/i.test(url)) return { type: "youtube", videoId: "" };
      return { type: "audio", videoId: "" };
    }

    function parseYoutubeId(value) {
      const raw = value.trim();
      const direct = raw.match(/^[a-zA-Z0-9_-]{11}$/);
      if (direct) return raw;
      try {
        const url = new URL(raw.startsWith("http") ? raw : `https://${raw}`);
        if (url.hostname.includes("youtu.be")) return url.pathname.replace("/", "").slice(0, 11);
        if (url.searchParams.get("v")) return url.searchParams.get("v").slice(0, 11);
        const parts = url.pathname.split("/").filter(Boolean);
        const marker = parts.findIndex((part) => ["embed", "shorts", "live"].includes(part));
        if (marker >= 0 && parts[marker + 1]) return parts[marker + 1].slice(0, 11);
      } catch {}
      return "";
    }

    function guessTitle(url) {
      try {
        const parsed = new URL(url.startsWith("http") ? url : `https://${url}`);
        const last = decodeURIComponent(parsed.pathname.split("/").filter(Boolean).pop() || parsed.hostname);
        return last.replace(/\.(mp3|wav|ogg|m4a|aac)$/i, "").replace(/[-_]+/g, " ").slice(0, 96) || "Música sem título";
      } catch {
        return "Música sem título";
      }
    }

    function quoteValue(value) {
      return `"${String(value).replace(/\\/g, "\\\\").replace(/"/g, '\\"')}"`;
    }

    function formatTime(value) {
      const total = Math.max(0, Math.floor(Number(value) || 0));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      if (hours) {
        return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function uid() {
      if (crypto && crypto.randomUUID) return crypto.randomUUID();
      return Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    function cssEscape(value) {
      if (window.CSS && CSS.escape) return CSS.escape(value);
      return String(value).replace(/["\\]/g, "\\$&");
    }

    function toast(message) {
      dom.toast.textContent = message;
      dom.toast.classList.add("is-visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => dom.toast.classList.remove("is-visible"), 2400);
    }

    function refreshIcons() {
      if (window.lucide) lucide.createIcons();
    }

    function editInline(element, currentValue, maxLength, onSave) {
      if (!element || element.dataset.editing === "1") return;
      element.dataset.editing = "1";
      const original = element.innerHTML;
      const input = document.createElement("input");
      input.type = "text";
      input.value = currentValue;
      input.maxLength = maxLength;
      input.style.minHeight = "28px";
      input.style.padding = "4px 6px";
      input.style.font = "inherit";
      input.style.width = "100%";
      input.style.boxSizing = "border-box";
      element.innerHTML = "";
      element.appendChild(input);
      input.focus();
      input.select();

      let finished = false;
      const finish = (commit) => {
        if (finished) return;
        finished = true;
        const next = input.value.trim().slice(0, maxLength);
        element.dataset.editing = "";
        if (commit && next && next !== currentValue) {
          onSave(next);
        } else {
          element.innerHTML = original;
        }
      };

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          finish(true);
        } else if (event.key === "Escape") {
          event.preventDefault();
          finish(false);
        }
      });
      input.addEventListener("blur", () => finish(true));
      input.addEventListener("click", (event) => event.stopPropagation());
    }

    document.addEventListener("dblclick", (event) => {
      const playlistName = event.target.closest(".playlist-name");
      if (playlistName) {
        const item = playlistName.closest(".playlist-item");
        const button = item?.querySelector('button[data-action="select-playlist"]');
        const playlist = getPlaylist(button?.dataset.id);
        if (playlist) {
          event.preventDefault();
          editInline(playlistName, playlist.name, 72, (next) => {
            playlist.name = next;
            saveState();
            render();
          });
        }
        return;
      }
      const trackTitle = event.target.closest(".track-title");
      if (trackTitle) {
        const card = trackTitle.closest(".track-card");
        const track = findTrack(card?.dataset.trackId);
        if (track) {
          event.preventDefault();
          editInline(trackTitle, track.title, 96, (next) => {
            track.title = next;
            saveState();
            render();
          });
        }
        return;
      }
      const sfxTitle = event.target.closest(".sfx-title");
      if (sfxTitle) {
        const card = sfxTitle.closest(".sfx-card");
        const effect = findSfx(card?.dataset.sfxId);
        if (effect) {
          event.preventDefault();
          editInline(sfxTitle, effect.title, 72, (next) => {
            effect.title = next;
            saveState();
            renderSfx();
          });
        }
      }
    });
  </script>
</body>
</html>
